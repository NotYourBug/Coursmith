{% extends "base.html" %}
{% block title %}兑换课程｜智课工坊{% endblock %}
{% block content %}<section class="narrow-form"><h1>兑换已购课程</h1><p>使用店铺交付的激活码；激活期限与学习期限分别以发行信息及兑换结果为准。</p>{% if error %}<p role="alert">{{ error }} · {{ request_id }}</p>{% endif %}<form method="post" action="/access/redeem"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label for="course_slug">课程（可自动识别）</label><select id="course_slug" name="course_slug"><option value="">按发行码识别</option>{% for course in courses %}<option value="{{ course.slug }}" {% if course.slug == selected_course %}selected{% endif %}>{{ course.title }}</option>{% endfor %}</select><label for="code">激活码</label><input id="code" name="code" placeholder="CS-..." autocomplete="off" required><button class="button">兑换并领取学习凭证</button></form><a href="/access/restore">已有学习凭证，恢复设备</a><p><a href="/help">购买与售后帮助</a></p></section>{% endblock %}
