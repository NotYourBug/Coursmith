{% extends "base.html" %}
{% block title %}兑换课程｜智课工坊{% endblock %}
{% block content %}<section class="narrow-form"><p class="eyebrow">ACCESS</p><h1>输入兑换码，进入课程</h1><p>购买完成后，从店铺客服处获得兑换码。课程会在浏览器中直接打开。</p>{% if error %}<div class="alert" role="alert">{{ error }}</div>{% endif %}<form method="post" action="/access/redeem"><label for="course_slug">选择课程</label><select id="course_slug" name="course_slug" required><option value="">请选择课程</option>{% for course in courses %}<option value="{{ course.slug }}" {% if course.slug == selected_course %}selected{% endif %}>{{ course.title }}</option>{% endfor %}</select><label for="code">兑换码</label><input id="code" name="code" placeholder="CS-..." autocomplete="one-time-code" required><button class="button" type="submit">验证并进入</button></form><a href="/help">遇到问题？查看帮助</a></section>{% endblock %}
