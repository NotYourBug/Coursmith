<!doctype html><html lang="zh-CN"><head>{{ chapter_head }}<meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/static/site.css"></head><body {{ body_attributes }}><main class="lesson-shell"><nav aria-label="章节导航"><a href="{{ '/courses/' if preview else '/learn/' }}{{ course.slug }}">目录</a>{% if previous %}<a href="{{ prefix }}/{{ previous.path }}">上一章</a>{% endif %}{% if next %}<a href="{{ prefix }}/{{ next.path }}">下一章</a>{% endif %}</nav><article class="lesson-body">{{ chapter_body }}</article>{% if not preview %}<form method="post" action="/learn/{{ course.slug }}/chapters/{{ chapter.number }}/progress"><input type="hidden" name="csrf_token" value="{{ csrf_token or '' }}"><input type="hidden" name="completed" value="{{ 'false' if completed else 'true' }}"><button class="button">{{ '取消完成' if completed else '标记完成' }}</button></form>{% else %}<p>当前为免费试学。<a href="/access">兑换已购课程</a></p>{% endif %}</main></body></html>
