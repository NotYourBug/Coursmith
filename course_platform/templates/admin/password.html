{% extends "admin/base.html" %}
{% block title %}修改密码 · 智课工坊{% endblock %}
{% block content %}
{% include "admin/field_errors.html" %}
<h1>修改密码</h1><p>密码须为 12–128 字符。更改后所有设备需重新登录。</p>
<form action="/admin/account/password" method="post" class="account-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <input type="hidden" name="revision" value="{{ revision }}">
  <label for="current_password">当前密码</label><input id="current_password" type="password" name="current_password" autocomplete="current-password" maxlength="128" required>
  <label for="new_password">新密码</label><input id="new_password" type="password" name="new_password" autocomplete="new-password" minlength="12" maxlength="128" required>
  <label for="confirm_password">确认新密码</label><input id="confirm_password" type="password" name="confirm_password" autocomplete="new-password" minlength="12" maxlength="128" required>
  <button type="submit">保存密码并退出</button>
</form>
{% endblock %}
