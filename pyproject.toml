[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "zhike-course-platform"
version = "0.1.0"
description = "A mobile-first course delivery platform backed by the existing course generator."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "uvicorn[standard]>=0.34,<1",
  "playwright>=1.50,<2",
  "openai>=1.60,<3",
  "selenium>=4.27,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=6,<7", "ruff>=0.11,<1"]
feishu = ["lark-oapi>=1.4,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Start with release-blocking checks; expand this set while modernizing the legacy generator.
select = ["E9", "F63", "F7", "F82"]

[tool.setuptools.packages.find]
include = ["course_platform*"]
